name: CI — Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64, arm64]
        configuration: [Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore WinPrompter.csproj -p:Platform=${{ matrix.platform }}

      - name: Build
        run: dotnet build WinPrompter.csproj -p:Platform=${{ matrix.platform }} -c ${{ matrix.configuration }} --no-restore

      - name: Upload build artifacts
        if: matrix.platform == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}-${{ matrix.configuration }}
          path: bin/${{ matrix.platform }}/${{ matrix.configuration }}/
          retention-days: 7
